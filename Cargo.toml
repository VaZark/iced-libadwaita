[package]
name = "iced-libadwaita"
version = "0.1.0"
categories = ["gui"]
edition = "2024"
keywords = ["iced", "gui", "gnome", "libadwaita", "theme"]
description = "libadwaita-style theme and widgets for iced"

[workspace]
members = ["gallery"]
default-members = ["."]

[dependencies]
iced = { version = "0.14", features = ["advanced", "svg", "image", "tokio", "canvas"] }

