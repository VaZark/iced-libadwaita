# Complete independent toy base; native styling plus bounded app geometry.
# Aero: glassy blue-grey chrome, soft gradients with a bright hover glow, rounded corners.
# Try it:  IAD_THEME=themes/win7.conf cargo run -p iced-adaptive-design-theme-toys -- win7
[theme]
name=Windows 7
key=win7

[colors]
accent=#3399ff
window-bg=#f0f0f0
window-fg=#000000
view-bg=#ffffff
view-fg=#000000
card-bg=#ffffff
card-fg=#000000
headerbar-bg=#a9c3e4
headerbar-fg=#000000
sidebar-bg=#eef3fa
sidebar-fg=#ffffff
popover-bg=#f5f5f5
popover-fg=#000000
dialog-bg=#f0f0f0
dialog-fg=#000000
success=#3c9a3c
warning=#e0a000
destructive=#c9302c
error=#c9302c
accent-fg=#ffffff
accent-text=#3399ff
destructive-fg=#ffffff
destructive-text=#c9302c
success-fg=#ffffff
success-text=#3c9a3c
warning-fg=#000000
warning-text=#e0a000
error-fg=#ffffff
error-text=#c9302c
headerbar-border=rgba(0, 0, 0, 0.35)
headerbar-shade=rgba(0, 0, 0, 0.35)
headerbar-darker-shade=rgba(0, 0, 0, 0.35)
card-shade=rgba(0, 0, 0, 0.35)
popover-shade=rgba(0, 0, 0, 0.35)
sidebar-border=rgba(0, 0, 0, 0.35)
secondary-sidebar-bg=#f0f0f0
secondary-sidebar-fg=#ffffff
thumbnail-bg=#ffffff
thumbnail-fg=#000000
overview-bg=#f0f0f0
overview-fg=#000000
active-toggle-bg=#cde6f7
active-toggle-fg=#000000
shade=rgba(0, 0, 0, 0.35)
scrollbar-outline=rgba(240, 240, 240, 0)
primary=#3d8de0
primary-fg=#ffffff
primary-text=#3399ff
focus-ring=#3399ff

[dark:colors]
accent=#3399ff
window-bg=#1f2429
window-fg=#e8eef5
view-bg=#161a1e
view-fg=#e8eef5
card-bg=#262c33
card-fg=#e8eef5
headerbar-bg=#2a3a50
headerbar-fg=#ffffff
sidebar-bg=#1a2027
sidebar-fg=#e8eef5
popover-bg=#2a3038
popover-fg=#e8eef5
dialog-bg=#1f2429
dialog-fg=#e8eef5
success=#5cc05c
warning=#f0b030
destructive=#e0503f
error=#e0503f
accent-fg=#ffffff
accent-text=#3399ff
destructive-fg=#ffffff
destructive-text=#e0503f
success-fg=#ffffff
success-text=#5cc05c
warning-fg=#e8eef5
warning-text=#f0b030
error-fg=#ffffff
error-text=#e0503f
headerbar-border=rgba(255, 255, 255, 0.25)
headerbar-shade=rgba(255, 255, 255, 0.25)
headerbar-darker-shade=rgba(255, 255, 255, 0.25)
card-shade=rgba(255, 255, 255, 0.25)
popover-shade=rgba(255, 255, 255, 0.25)
sidebar-border=rgba(255, 255, 255, 0.25)
secondary-sidebar-bg=#1f2429
secondary-sidebar-fg=#e8eef5
thumbnail-bg=#161a1e
thumbnail-fg=#e8eef5
overview-bg=#1f2429
overview-fg=#e8eef5
active-toggle-bg=#27425c
active-toggle-fg=#e8eef5
shade=rgba(255, 255, 255, 0.25)
scrollbar-outline=rgba(31, 36, 41, 0)
primary=#2f7bd0
primary-fg=#ffffff
primary-text=#3399ff
focus-ring=#3399ff

[metrics]
space-xs=4
space-s=6
space-m=12
space-l=18
space-xl=24
radius-s=3
radius-m=3
radius-l=4
radius-menu=3
radius-popover=4
radius-toast=4
radius-window=7
button-padding-y=3
button-padding-x=14
button-min-height=23
entry-padding-y=2
entry-padding-x=4
entry-min-height=23
border-width=1
icon-size=16
row-padding-y=6
row-padding-x=12
row-min-height=32
row-spacing=12
card-padding=10
dialog-padding=24
popover-padding=8
page-padding-y=24
page-padding-x=12
group-spacing=24
clamp-maximum=600
headerbar-height=32
gutter=12
band-air=8
sidebar-width=210
sidebar-row-height=24
scrollbar-width=16
space-xxs=2
space-xxl=36
radius-pill=999
pill-padding-y=10
pill-padding-x=32
focus-ring-width=1
switch-size=26
checkbox-size=20
scrollbar-slider-width=14
scrollbar-margin=0
progress-height=15
list-spacing=0
headerbar-padding-y=0
headerbar-padding-x=6
toolbar-spacing=6
dialog-width=360
sidebar-padding=6
sidebar-spacing=2
sidebar-row-padding=12
gap=8
inset=8
code-padding=10
inline-padding-x=3
empty-padding-y=60
small-button-padding-y=2
small-button-padding-x=10
focus-style=ring

[typography]
text-scale=1
base-size=14
title-1=1.81
title-2=1.36
title-3=1.2
title-4=1.1
heading=1
caption-heading=0.82
caption=0.82
monospace=1
small=0.8861623
font-family=Segoe UI
monospace-font-family=Consolas

[windows]
button-layout=:minimize,maximize,close
button-size=22px
button-gap=1px
button-radius=18%
button-icon-size=12px
titlebar-double-click=toggle-maximize
titlebar-middle-click=none
titlebar-right-click=menu
frame-border-width=6px
frame-border=#b9d1ea
frame-border-style=solid
titlebar-align=start
titlebar-font-weight=normal
titlebar-icon=true
button-style=headerbar
flat-headerbars=false

[shadows]
card=none
popover=1px 2px 5px 0px rgba(0, 0, 0, 0.35)
dialog=0px 4px 14px 2px rgba(0, 0, 0, 0.45)
osd=0px 2px 8px 0px rgba(0, 0, 0, 0.4)

[gradients]
titlebar=linear-gradient(180deg, #d6e4f5 0%, #b9d1ea 45%, #a9c3e4 50%, #b6cde8 100%)
headerbar=linear-gradient(180deg, #d6e4f5 0%, #b9d1ea 45%, #a9c3e4 50%, #b6cde8 100%)
sidebar=linear-gradient(180deg, #fcfdff 0%, #eaf0f9 100%)
progress=linear-gradient(180deg, #b4f0a0 0%, #3cc23c 50%, #2fa82f 100%)

[frame.card]
border-style=solid
border-width=1px
radius=3px

[frame.field]
border-style=solid
border-width=1px
bg=#ffffff

[button.default]
bg-gradient=linear-gradient(180deg, #f2f2f2 0%, #ebebeb 50%, #dddddd 50%, #cfcfcf 100%)
hover-bg-gradient=linear-gradient(180deg, #eaf6fd 0%, #d9f0fc 50%, #bee6fd 50%, #a7d9f5 100%)
active-bg-gradient=linear-gradient(180deg, #e5f4fc 0%, #c4e5f6 50%, #98d1ef 50%, #68b3db 100%)
fg=#000000
border=#707070
border-width=1px
radius=3px

[button.suggested]
bg-gradient=linear-gradient(180deg, #7db6ee 0%, #4a94e0 50%, #2f7bd0 50%, #3d8de0 100%)
hover-bg-gradient=linear-gradient(180deg, #9ccaf5 0%, #66a8ea 50%, #4a94e0 50%, #5aa3ec 100%)
fg=#ffffff
border=#2a5f9a
border-width=1px
radius=3px

[button.headerbar]
bg-gradient=linear-gradient(180deg, #e3edf9 0%, #c5d8ef 50%, #aec8e6 50%, #bfd3ec 100%)
hover-bg-gradient=linear-gradient(180deg, #f0f7ff 0%, #d5e8fa 50%, #bcd9f4 50%, #c8e0f8 100%)
fg=#000000
border=#ffffff
border-width=1px
radius=3px

[button.destructive]
bg-gradient=linear-gradient(180deg, #e9a59c 0%, #d4685b 50%, #c0392b 50%, #d4604f 100%)
fg=#ffffff
border=#8a2a20
border-width=1px
radius=3px

# Selected content is distinct from a raised command button.
[button.opaque]
bg=#cde6f7
fg=#000000
hover-bg=#cde6f7
active-bg=#cde6f7
border-width=0px
radius=0px

# Tree geometry belongs to the theme, not per-toy widget overrides.
[tree]
row-height=24px
level-offset=18px
icon-size=16px
handle-padding=3px
icon-padding=2px
label-padding=3px
checkbox-padding=2px
row-radius=2px
expander-icon-inset=2px
connector-width=1px

[gradients]
[button.flat]
bg=#ffffff
fg=#202020
hover-bg=#e8f3fb
active-bg=#cde6f7
border-width=0px
radius=0px
[button.link]
fg=#ffffff
hover-bg=#4d829a
active-bg=#254658

# App-owned reference geometry; validated by theme-toys/src/design.rs.
[toy.win7]
width=1280px
height=720px
menu-width=498px
menu-height=598px
programs-width=304px
menu-padding=8px
menu-radius=7px
program-row-height=23px
place-row-height=42px
search-height=54px
taskbar-height=48px
task-button-width=60px
program-indent=24px
program-padding=4px
user-height=86px
user-icon-size=48px
desktop-icon-size=32px

[gradients]
desktop=linear-gradient(135deg, #0876b8 0%, #08a1dc 50%, #005aa5 100%)
[gradients]
start-menu=linear-gradient(180deg, #36627a 0%, #254658 48%, #38778e 100%)
[gradients]
taskbar=linear-gradient(180deg, #449bb9 0%, #207ea6 50%, #155a80 100%)
