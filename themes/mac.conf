# Aqua: pill-shaped glossy buttons, a brushed title bar with the window buttons at the start, soft shadows.
# Try it:  IAD_THEME=themes/mac.conf cargo run -p iced-adaptive-design-theme-toys -- mac
[theme]
name=Mac Aqua
key=mac

[colors]
accent=#3b99fc
window-bg=#ececec
window-fg=#000000
view-bg=#ffffff
view-fg=#000000
card-bg=#f6f6f6
card-fg=#000000
headerbar-bg=#d6d6d6
headerbar-fg=#000000
sidebar-bg=#dde4ee
sidebar-fg=#000000
popover-bg=#f4f4f4
popover-fg=#000000
dialog-bg=#ececec
dialog-fg=#000000
success=#2ca44c
warning=#e8a800
destructive=#d0342c
error=#d0342c
accent-fg=#ffffff
accent-text=#3b99fc
destructive-fg=#ffffff
destructive-text=#d0342c
success-fg=#ffffff
success-text=#2ca44c
warning-fg=#000000
warning-text=#e8a800
error-fg=#ffffff
error-text=#d0342c
headerbar-border=rgba(0, 0, 0, 0.3)
headerbar-shade=rgba(0, 0, 0, 0.3)
headerbar-darker-shade=rgba(0, 0, 0, 0.3)
card-shade=rgba(0, 0, 0, 0.3)
popover-shade=rgba(0, 0, 0, 0.3)
sidebar-border=rgba(0, 0, 0, 0.3)
secondary-sidebar-bg=#ececec
secondary-sidebar-fg=#000000
thumbnail-bg=#ffffff
thumbnail-fg=#000000
overview-bg=#ececec
overview-fg=#000000
active-toggle-bg=#b9d6fb
active-toggle-fg=#000000
shade=rgba(0, 0, 0, 0.3)
scrollbar-outline=rgba(236, 236, 236, 0)
primary=#3b8fe8
primary-fg=#ffffff
primary-text=#3b99fc
focus-ring=#7fb5f5

[dark:colors]
accent=#3b99fc
window-bg=#2b2b2b
window-fg=#e8e8e8
view-bg=#1e1e1e
view-fg=#e8e8e8
card-bg=#333333
card-fg=#e8e8e8
headerbar-bg=#3a3a3a
headerbar-fg=#e8e8e8
sidebar-bg=#262a31
sidebar-fg=#e8e8e8
popover-bg=#363636
popover-fg=#e8e8e8
dialog-bg=#2b2b2b
dialog-fg=#e8e8e8
success=#4cc46c
warning=#f0b820
destructive=#e0524a
error=#e0524a
accent-fg=#ffffff
accent-text=#3b99fc
destructive-fg=#ffffff
destructive-text=#e0524a
success-fg=#ffffff
success-text=#4cc46c
warning-fg=#e8e8e8
warning-text=#f0b820
error-fg=#ffffff
error-text=#e0524a
headerbar-border=rgba(255, 255, 255, 0.25)
headerbar-shade=rgba(255, 255, 255, 0.25)
headerbar-darker-shade=rgba(255, 255, 255, 0.25)
card-shade=rgba(255, 255, 255, 0.25)
popover-shade=rgba(255, 255, 255, 0.25)
sidebar-border=rgba(255, 255, 255, 0.25)
secondary-sidebar-bg=#2b2b2b
secondary-sidebar-fg=#e8e8e8
thumbnail-bg=#1e1e1e
thumbnail-fg=#e8e8e8
overview-bg=#2b2b2b
overview-fg=#e8e8e8
active-toggle-bg=#2b4a72
active-toggle-fg=#e8e8e8
shade=rgba(255, 255, 255, 0.25)
scrollbar-outline=rgba(43, 43, 43, 0)
primary=#2f7fd8
primary-fg=#ffffff
primary-text=#3b99fc
focus-ring=#5a9fe8

[metrics]
space-xs=4
space-s=6
space-m=12
space-l=18
space-xl=24
radius-s=4
radius-m=11
radius-l=8
radius-menu=5
radius-popover=6
radius-toast=8
radius-window=6
button-padding-y=3
button-padding-x=16
button-min-height=22
entry-padding-y=2
entry-padding-x=6
entry-min-height=22
border-width=1
icon-size=16
row-padding-y=6
row-padding-x=12
row-min-height=34
row-spacing=12
card-padding=12
dialog-padding=24
popover-padding=8
page-padding-y=24
page-padding-x=12
group-spacing=24
clamp-maximum=600
headerbar-height=38
gutter=14
band-air=8
sidebar-width=190
sidebar-row-height=24
scrollbar-width=8
space-xxs=2
space-xxl=36
radius-pill=999
pill-padding-y=10
pill-padding-x=32
focus-ring-width=3
switch-size=22
checkbox-size=20
scrollbar-slider-width=4
scrollbar-margin=2
progress-height=11
list-spacing=0
headerbar-padding-y=0
headerbar-padding-x=6
toolbar-spacing=6
dialog-width=360
sidebar-padding=6
sidebar-spacing=2
sidebar-row-padding=12
gap=10
inset=10
code-padding=10
inline-padding-x=3
empty-padding-y=60
small-button-padding-y=2
small-button-padding-x=10
focus-style=ring

[typography]
text-scale=1
base-size=13
title-1=1.81
title-2=1.36
title-3=1.2
title-4=1.1
heading=1
caption-heading=0.82
caption=0.82
monospace=1
small=0.8861623
font-family=Lucida Grande
monospace-font-family=Monaco

[windows]
button-layout=close,minimize,maximize:
button-size=14px
button-gap=6px
button-radius=50%
button-icon-size=8px
titlebar-double-click=toggle-maximize
titlebar-middle-click=none
titlebar-right-click=menu
frame-border-width=1px
frame-border=#7f7f7f
frame-border-style=solid
titlebar-align=center
titlebar-font-weight=normal
titlebar-icon=false
button-style=headerbar
flat-headerbars=false

[shadows]
card=none
popover=0px 6px 18px 0px rgba(0, 0, 0, 0.4)
dialog=0px 10px 30px 0px rgba(0, 0, 0, 0.5)
osd=0px 4px 14px 0px rgba(0, 0, 0, 0.4)

[gradients]
titlebar=linear-gradient(180deg, #ebebeb 0%, #d3d3d3 50%, #bdbdbd 100%)
headerbar=linear-gradient(180deg, #ebebeb 0%, #d3d3d3 50%, #bdbdbd 100%)
sidebar=linear-gradient(180deg, #e3e9f2 0%, #d3dbe8 100%)
progress=linear-gradient(180deg, #a8d3ff 0%, #5aa9f5 50%, #2e8de8 51%, #6fc0ff 100%)

[frame.card]
border-style=solid
border-width=1px
radius=8px

[frame.field]
border-style=solid
border-width=1px
bg=#ffffff

[button.default]
bg-gradient=linear-gradient(180deg, #fdfdfd 0%, #e6e6e6 50%, #d2d2d2 51%, #ececec 100%)
hover-bg-gradient=linear-gradient(180deg, #ffffff 0%, #eeeeee 50%, #dcdcdc 51%, #f3f3f3 100%)
active-bg-gradient=linear-gradient(180deg, #c8c8c8 0%, #dedede 100%)
fg=#000000
border=#8c8c8c
border-width=1px
radius=11px

[button.suggested]
bg-gradient=linear-gradient(180deg, #a8d3ff 0%, #5aa9f5 50%, #2e8de8 51%, #6fc0ff 100%)
hover-bg-gradient=linear-gradient(180deg, #bfe0ff 0%, #73b8fa 50%, #449df0 51%, #85caff 100%)
active-bg-gradient=linear-gradient(180deg, #2e7fd8 0%, #5aa9f5 100%)
fg=#ffffff
border=#3472b7
border-width=1px
radius=11px

[button.headerbar]
bg-gradient=linear-gradient(180deg, #f5f5f5 0%, #c9c9c9 100%)
hover-bg-gradient=linear-gradient(180deg, #ffffff 0%, #d9d9d9 100%)
fg=#000000
border=#7c7c7c
border-width=1px
radius=7px

[button.destructive]
bg-gradient=linear-gradient(180deg, #ff9a90 0%, #e0483c 50%, #cc2f24 51%, #ee6a5e 100%)
fg=#ffffff
border=#a02018
border-width=1px
radius=11px
