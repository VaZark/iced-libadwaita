popover=0px 2px 8px 0px rgba(0, 43, 54, 0.3)
dialog=0px 4px 16px 0px rgba(0, 43, 54, 0.35)
osd=none

[windows]
button-layout=:minimize,maximize,close
button-size=22px
button-radius=20%
titlebar-double-click=toggle-maximize
titlebar-middle-click=none
titlebar-right-click=menu
button-gap=6px
button-icon-size=16px
