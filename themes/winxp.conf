# Luna: a blue gradient title bar on a thick frame, glossy rounded buttons, a green start button, beige surfaces.
# Try it:  IAD_THEME=themes/winxp.conf cargo run -p iced-adaptive-design-theme-toys -- winxp
[theme]
name=Windows XP
key=winxp

[colors]
accent=#316ac5
window-bg=#ece9d8
window-fg=#000000
view-bg=#ffffff
view-fg=#000000
card-bg=#f5f4ea
card-fg=#000000
headerbar-bg=#0a5be0
headerbar-fg=#ffffff
sidebar-bg=#7ba2e7
sidebar-fg=#ffffff
popover-bg=#ffffff
popover-fg=#000000
dialog-bg=#ece9d8
dialog-fg=#000000
success=#3c8f3c
warning=#e0a000
destructive=#c93b2b
error=#c93b2b
accent-fg=#ffffff
accent-text=#316ac5
destructive-fg=#ffffff
destructive-text=#c93b2b
success-fg=#ffffff
success-text=#3c8f3c
warning-fg=#000000
warning-text=#e0a000
error-fg=#ffffff
error-text=#c93b2b
headerbar-border=rgba(0, 60, 116, 0.5)
headerbar-shade=rgba(0, 60, 116, 0.5)
headerbar-darker-shade=rgba(0, 60, 116, 0.5)
card-shade=rgba(0, 60, 116, 0.5)
popover-shade=rgba(0, 60, 116, 0.5)
sidebar-border=rgba(0, 60, 116, 0.5)
secondary-sidebar-bg=#ece9d8
secondary-sidebar-fg=#000000
thumbnail-bg=#ffffff
thumbnail-fg=#000000
overview-bg=#ece9d8
overview-fg=#000000
active-toggle-bg=#c1d2ee
active-toggle-fg=#000000
shade=rgba(0, 60, 116, 0.5)
scrollbar-outline=rgba(236, 233, 216, 0)
primary=#3c8f3c
primary-fg=#ffffff
primary-text=#316ac5
focus-ring=#316ac5

[dark:colors]
accent=#ff9a1f
window-bg=#25282e
window-fg=#e8e8e8
view-bg=#1d1f24
view-fg=#e8e8e8
card-bg=#2d3038
card-fg=#e8e8e8
headerbar-bg=#202226
headerbar-fg=#ffffff
sidebar-bg=#2a2d36
sidebar-fg=#e8e8e8
popover-bg=#2d3038
popover-fg=#e8e8e8
dialog-bg=#25282e
dialog-fg=#e8e8e8
success=#5cc05c
warning=#f0b030
destructive=#e0503f
error=#e0503f
accent-fg=#000000
accent-text=#ff9a1f
destructive-fg=#000000
destructive-text=#e0503f
success-fg=#000000
success-text=#5cc05c
warning-fg=#e8e8e8
warning-text=#f0b030
error-fg=#000000
error-text=#e0503f
headerbar-border=rgba(255, 255, 255, 0.3)
headerbar-shade=rgba(255, 255, 255, 0.3)
headerbar-darker-shade=rgba(255, 255, 255, 0.3)
card-shade=rgba(255, 255, 255, 0.3)
popover-shade=rgba(255, 255, 255, 0.3)
sidebar-border=rgba(255, 255, 255, 0.3)
secondary-sidebar-bg=#25282e
secondary-sidebar-fg=#e8e8e8
thumbnail-bg=#1d1f24
thumbnail-fg=#e8e8e8
overview-bg=#25282e
overview-fg=#e8e8e8
active-toggle-bg=#4a4030
active-toggle-fg=#e8e8e8
shade=rgba(255, 255, 255, 0.3)
scrollbar-outline=rgba(37, 40, 46, 0)
primary=#e08000
primary-fg=#000000
primary-text=#ff9a1f
focus-ring=#ff9a1f

[metrics]
space-xs=4
space-s=6
space-m=12
space-l=18
space-xl=24
radius-s=3
radius-m=3
radius-l=4
radius-menu=3
radius-popover=3
radius-toast=4
radius-window=8
button-padding-y=3
button-padding-x=12
button-min-height=23
entry-padding-y=2
entry-padding-x=4
entry-min-height=22
border-width=1
icon-size=16
row-padding-y=6
row-padding-x=12
row-min-height=30
row-spacing=12
card-padding=10
dialog-padding=24
popover-padding=8
page-padding-y=24
page-padding-x=12
group-spacing=24
clamp-maximum=600
headerbar-height=30
gutter=12
band-air=8
sidebar-width=200
sidebar-row-height=24
scrollbar-width=8
space-xxs=2
space-xxl=36
radius-pill=999
pill-padding-y=10
pill-padding-x=32
focus-ring-width=1
switch-size=26
checkbox-size=13
scrollbar-slider-width=4
scrollbar-margin=2
progress-height=14
list-spacing=0
headerbar-padding-y=0
headerbar-padding-x=6
toolbar-spacing=6
dialog-width=360
sidebar-padding=6
sidebar-spacing=2
sidebar-row-padding=12
gap=8
inset=8
code-padding=10
inline-padding-x=3
empty-padding-y=60
small-button-padding-y=2
small-button-padding-x=10
focus-style=ring

[typography]
text-scale=1
base-size=12
title-1=1.81
title-2=1.36
title-3=1.2
title-4=1.1
heading=1
caption-heading=0.82
caption=0.82
monospace=1
small=0.8861623
font-family=Tahoma
monospace-font-family=Lucida Console

[windows]
button-layout=:minimize,maximize,close
button-size=21px
button-gap=2px
button-radius=18%
button-icon-size=12px
titlebar-double-click=toggle-maximize
titlebar-middle-click=none
titlebar-right-click=menu
frame-border-width=3px
frame-border=#0831d9
frame-border-style=solid
titlebar-align=start
titlebar-font-weight=bold
titlebar-icon=true
button-style=headerbar
flat-headerbars=false

[shadows]
card=none
popover=2px 2px 3px 0px rgba(0, 0, 0, 0.4)
dialog=3px 3px 6px 0px rgba(0, 0, 0, 0.5)
osd=none

[gradients]
titlebar=linear-gradient(180deg, #0997ff 0%, #0053ee 8%, #0050ee 40%, #0066ff 88%, #0054e3 100%)
sidebar=linear-gradient(180deg, #7ba2e7 0%, #6375d6 100%)
progress=linear-gradient(180deg, #a7f0a7 0%, #2fb62f 50%, #1f9a1f 100%)
headerbar=linear-gradient(180deg, #0997ff 0%, #0053ee 8%, #0050ee 40%, #0066ff 88%, #0054e3 100%)

[frame.card]
border-style=solid
border-width=1px
radius=4px

[frame.field]
border-style=solid
border-width=1px
bg=#ffffff

[frame.popover]
border-style=solid
border-width=1px

[button.default]
bg-gradient=linear-gradient(180deg, #ffffff 0%, #ecebe5 86%, #d6d0c5 100%)
hover-bg-gradient=linear-gradient(180deg, #fff0cf 0%, #fdd889 50%, #f8b330 100%)
active-bg-gradient=linear-gradient(180deg, #cdc8b8 0%, #e3e1d2 100%)
fg=#000000
border=#003c74
border-width=1px
radius=3px

[button.suggested]
bg-gradient=linear-gradient(180deg, #6dc66d 0%, #3c9f3c 50%, #2f8a2f 100%)
fg=#ffffff
border=#1d5f1d
border-width=1px
radius=9px

[button.headerbar]
bg-gradient=linear-gradient(180deg, #5b9bff 0%, #2f69e6 100%)
hover-bg-gradient=linear-gradient(180deg, #7fb2ff 0%, #4a82f0 100%)
fg=#ffffff
border=#ffffff
border-width=1px
radius=3px

[button.destructive]
bg-gradient=linear-gradient(180deg, #e8805f 0%, #c9411f 100%)
fg=#ffffff
border=#ffffff
border-width=1px
radius=3px
