# A grey desktop of raised and sunken frames, a navy title bar, dotted focus. Dark = high contrast.
# Try it:  IAD_THEME=themes/win95.conf cargo run -p iced-adaptive-design-theme-toys -- win95
[theme]
name=Windows Classic
key=win95

[colors]
accent=#000080
window-bg=#d4d0c8
window-fg=#000000
view-bg=#ffffff
view-fg=#000000
card-bg=#d4d0c8
card-fg=#000000
headerbar-bg=#000080
headerbar-fg=#ffffff
sidebar-bg=#d4d0c8
sidebar-fg=#000000
popover-bg=#d4d0c8
popover-fg=#000000
dialog-bg=#d4d0c8
dialog-fg=#000000
success=#008000
warning=#808000
destructive=#800000
error=#800000
accent-fg=#ffffff
accent-text=#000080
destructive-fg=#ffffff
destructive-text=#800000
success-fg=#ffffff
success-text=#008000
warning-fg=#000000
warning-text=#808000
error-fg=#ffffff
error-text=#800000
headerbar-border=#808080
headerbar-shade=#808080
headerbar-darker-shade=#808080
card-shade=#808080
popover-shade=#808080
sidebar-border=#808080
secondary-sidebar-bg=#d4d0c8
secondary-sidebar-fg=#000000
thumbnail-bg=#ffffff
thumbnail-fg=#000000
overview-bg=#d4d0c8
overview-fg=#000000
active-toggle-bg=#ffffff
active-toggle-fg=#000000
shade=#808080
scrollbar-outline=rgba(192, 192, 192, 0)
primary=#d4d0c8
primary-fg=#000000
primary-text=#000080
focus-ring=#000000

[dark:colors]
accent=#ffff00
window-bg=#000000
window-fg=#ffffff
view-bg=#000000
view-fg=#ffffff
card-bg=#000000
card-fg=#ffffff
headerbar-bg=#000000
headerbar-fg=#ffffff
sidebar-bg=#000000
sidebar-fg=#ffffff
popover-bg=#000000
popover-fg=#ffffff
dialog-bg=#000000
dialog-fg=#ffffff
success=#00ff00
warning=#ffff00
destructive=#ff0000
error=#ff0000
accent-fg=#000000
accent-text=#ffff00
destructive-fg=#000000
destructive-text=#ff0000
success-fg=#000000
success-text=#00ff00
warning-fg=#ffffff
warning-text=#ffff00
error-fg=#000000
error-text=#ff0000
headerbar-border=#ffffff
headerbar-shade=#ffffff
headerbar-darker-shade=#ffffff
card-shade=#ffffff
popover-shade=#ffffff
sidebar-border=#ffffff
secondary-sidebar-bg=#000000
secondary-sidebar-fg=#ffffff
thumbnail-bg=#000000
thumbnail-fg=#ffffff
overview-bg=#000000
overview-fg=#ffffff
active-toggle-bg=#800080
active-toggle-fg=#ffffff
shade=#ffffff
scrollbar-outline=rgba(0, 0, 0, 0)
primary=#000000
primary-fg=#ffffff
primary-text=#ffff00
focus-ring=#ffff00

[metrics]
space-xs=2
space-s=4
space-m=6
space-l=8
space-xl=12
radius-s=0
radius-m=0
radius-l=0
radius-menu=0
radius-popover=0
radius-toast=0
radius-window=0
button-padding-y=3
button-padding-x=12
button-min-height=23
entry-padding-y=3
entry-padding-x=4
entry-min-height=23
border-width=2
icon-size=16
row-padding-y=2
row-padding-x=4
row-min-height=22
row-spacing=6
card-padding=8
dialog-padding=12
popover-padding=2
page-padding-y=8
page-padding-x=8
group-spacing=10
clamp-maximum=600
headerbar-height=20
gutter=8
band-air=4
sidebar-width=180
sidebar-row-height=18
scrollbar-width=16
space-xxs=1
space-xxl=16
radius-pill=0
pill-padding-y=10
pill-padding-x=32
focus-ring-width=1
switch-size=20
checkbox-size=13
scrollbar-slider-width=16
scrollbar-margin=0
progress-height=18
list-spacing=0
headerbar-padding-y=0
headerbar-padding-x=2
toolbar-spacing=2
dialog-width=320
sidebar-padding=2
sidebar-spacing=0
sidebar-row-padding=4
gap=6
inset=6
code-padding=6
inline-padding-x=3
empty-padding-y=60
small-button-padding-y=1
small-button-padding-x=6
focus-style=dotted

[typography]
text-scale=1
base-size=11
title-1=1.81
title-2=1.36
title-3=1.2
title-4=1.1
heading=1
caption-heading=0.82
caption=0.82
monospace=1
small=0.8861623
font-family=MS Sans Serif
monospace-font-family=Fixedsys

[windows]
button-layout=:minimize,maximize,close
button-size=16px
button-gap=2px
button-radius=0%
button-icon-size=10px
titlebar-double-click=toggle-maximize
titlebar-middle-click=none
titlebar-right-click=menu
frame-border-width=4px
frame-border-style=window
titlebar-align=start
titlebar-font-weight=bold
titlebar-icon=true
button-style=default
flat-headerbars=false

[shadows]
card=none
popover=none
dialog=none
osd=none

[gradients]
titlebar=linear-gradient(90deg, #0a246a 0%, #a6caf0 100%)
progress=linear-gradient(180deg, #000080, #000080)

[frame.window]
border-style=window
border-width=2px
border-light=#ffffff
border-dark=#000000
border-light-inner=#dfdfdf
border-dark-inner=#808080

[frame.card]
border-style=etched
border-width=2px
border-light=#ffffff
border-dark=#000000
border-light-inner=#dfdfdf
border-dark-inner=#808080

[frame.field]
border-style=sunken
border-width=2px
border-light=#ffffff
border-dark=#000000
border-light-inner=#dfdfdf
border-dark-inner=#808080
bg=#ffffff

[frame.well]
bg=#3a6ea5
border-style=sunken
border-width=2px
border-light=#ffffff
border-dark=#000000
border-light-inner=#dfdfdf
border-dark-inner=#808080

[frame.panel]
border-style=raised
border-width=2px
border-light=#ffffff
border-dark=#000000
border-light-inner=#dfdfdf
border-dark-inner=#808080

[frame.popover]
border-style=raised
border-width=2px
border-light=#ffffff
border-dark=#000000
border-light-inner=#dfdfdf
border-dark-inner=#808080

[frame.dialog]
border-style=window
border-width=2px
border-light=#ffffff
border-dark=#000000
border-light-inner=#dfdfdf
border-dark-inner=#808080

[button.default]
border-style=raised
border-width=2px
border-light=#ffffff
border-dark=#000000
border-light-inner=#dfdfdf
border-dark-inner=#808080
bg=#d4d0c8
fg=#000000
hover-bg=#d4d0c8
active-bg=#d4d0c8

[button.raised]
border-style=raised
border-width=2px
border-light=#ffffff
border-dark=#000000
border-light-inner=#dfdfdf
border-dark-inner=#808080
bg=#d4d0c8
fg=#000000
hover-bg=#d4d0c8
active-bg=#d4d0c8

[button.suggested]
border-style=raised
border-width=2px
border-light=#ffffff
border-dark=#000000
border-light-inner=#dfdfdf
border-dark-inner=#808080
bg=#d4d0c8
fg=#000000
hover-bg=#d4d0c8
active-bg=#d4d0c8

[button.flat]
bg=#ffffff
fg=#000000
hover-bg=#d0d0d0
active-bg=#b0b0b0

# Selected content is distinct from a raised command button.
[button.opaque]
bg=#000080
fg=#ffffff
hover-bg=#000080
active-bg=#000080
border-width=0px
radius=0px

[progress]
style=blocks
block-width=8px
block-gap=2px
block-inset=1px

[frame.progress]
border-style=sunken
border-width=2px
bg=#d4d0c8
border-light=#ffffff
border-dark=#808080
border-light-inner=#dfdfdf
border-dark-inner=#000000

[frame.radio]
border-style=sunken
border-width=2px
size=12px
bg=#ffffff
glyph=dot
border-light=#ffffff
border-dark=#808080
border-light-inner=#dfdfdf
border-dark-inner=#000000

# Tree geometry belongs to the theme, not per-toy widget overrides.
[tree]
row-height=20px
level-offset=16px
icon-size=16px
handle-padding=2px
icon-padding=1px
label-padding=2px
checkbox-padding=2px
row-radius=0px
expander-icon-inset=2px
connector-width=1px

[frame.tab]
border-style=raised
border-width=2px
border-edges=no-bottom
bg=#d4d0c8
border-light=#ffffff
border-dark=#404040
border-light-inner=#dfdfdf
border-dark-inner=#808080

[tabs]
height=18px
raise=2px
panel-padding=0px

[dark:frame.tab]
bg=#000000

