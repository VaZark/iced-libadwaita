[package]
name = "iced-adaptive-design-gallery"
version = "0.1.0"
edition = "2024"
description = "A tour of the iced-adaptive-design components"
publish = false

[dependencies]
iced-adaptive-design = { path = ".." }
# Wayland only on Linux: no `x11` feature. An app that depends on this crate should also set
# `default-features = false` on its own `iced`, or Cargo turns the X11 backend back on.
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "crisp", "web-colors", "thread-pool", "linux-theme-detection", "wayland", "advanced", "svg", "image", "tokio", "canvas"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tokio = { version = "1", features = ["time"] }

[[bin]]
name = "gallery"
path = "src/main.rs"
